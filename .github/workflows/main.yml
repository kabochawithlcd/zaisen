name: Run ty.py every minute (within 5-minute workflow)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run ty.py every minute for 5 minutes
        run: |
          for i in {1..5}
          do
            echo "Run $i at $(date)"
            python TY copy.py
            if [ $i -lt 5 ]; then
              sleep 60
            fi
          done
